<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diamond Calculator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            background-color: white; 
            color: black; 
            text-align: center;
        }
        .container { max-width: 400px; margin: auto; }
        input { 
            width: 90%; 
            padding: 15px; 
            margin: 20px 0; 
            border: 2px solid #3390ec; 
            border-radius: 10px; 
            font-size: 18px;
            outline: none;
        }
        .card { 
            background: #f4f4f5; 
            border-radius: 15px; 
            padding: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .row { 
            display: flex; 
            justify-content: space-between; 
            padding: 15px 10px; 
            border-bottom: 1px solid #ddd;
        }
        .row:last-child { border-bottom: none; }
        .kyat { font-weight: bold; color: #3390ec; }
    </style>
</head>
<body>

    <div class="container">
        <h3>💎 Diamond Prices (Kyats)</h3>
        <input type="number" id="baseInput" placeholder="Enter Base Number..." oninput="calculate()">

        <div class="card">
            <div class="row"><span>55 Diamonds</span><span class="kyat" id="p55">0 Kyats</span></div>
            <div class="row"><span>165 Diamonds</span><span class="kyat" id="p165">0 Kyats</span></div>
            <div class="row"><span>275 Diamonds</span><span class="kyat" id="p275">0 Kyats</span></div>
            <div class="row"><span>Weekly Pass</span><span class="kyat" id="pWP">0 Kyats</span></div>
            <div class="row"><span>Weekly Bundle</span><span class="kyat" id="pWVB">0 Kyats</span></div>
            <div class="row"><span>Monthly Bundle</span><span class="kyat" id="pMVB">0 Kyats</span></div>
        </div>
    </div>

    <script>
        // Initialize Telegram
        const tg = window.Telegram.WebApp;
        tg.ready(); // Tells Telegram the app is ready to show
        tg.expand(); // Opens it to full height

        function calculate() {
            const val = document.getElementById('baseInput').value;
            const inputVal = parseFloat(val);
            
            if (!inputVal || inputVal <= 0) return;

            const base = inputVal / 300;
            const factors = {
                p55: 39, p165: 116, p275: 187,
                pWP: 76, pWVB: 39, pMVB: 196
            };

            for (const [id, factor] of Object.entries(factors)) {
                const final = Math.round(base * factor);
                document.getElementById(id).innerText = final.toLocaleString() + " Kyats";
            }
        }
    </script>
</body>
</html>
